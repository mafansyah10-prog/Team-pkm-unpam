<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 480" width="100%" height="100%">
  <!-- Red Box Container -->
  <rect x="50" y="20" width="300" height="300" fill="#EF2329" stroke="#111111" stroke-width="14" />
  
  <!-- Right White Container / Frame -->
  <rect x="190" y="40" width="140" height="260" fill="#FFFFFF" stroke="#111111" stroke-width="12" />
  
  <!-- Left "C" Arc -->
  <path d="M 180,48 A 120,120 0 0,0 72,170 A 120,120 0 0,0 180,292" fill="none" stroke="#111111" stroke-width="16" stroke-linecap="square" />
  <path d="M 180,76 A 92,92 0 0,0 98,170 A 92,92 0 0,0 180,264" fill="none" stroke="#111111" stroke-width="12" stroke-linecap="square" />
  <line x1="176" y1="48" x2="176" y2="76" stroke="#111111" stroke-width="10" />
  <line x1="176" y1="264" x2="176" y2="292" stroke="#111111" stroke-width="10" />

  <!-- Horizontal T-bar -->
  <line x1="105" y1="130" x2="275" y2="130" stroke="#111111" stroke-width="14" stroke-linecap="square" />

  <!-- Vertical Anchor Shaft -->
  <line x1="196" y1="40" x2="196" y2="280" stroke="#111111" stroke-width="14" />

  <!-- Anchor Top Ring -->
  <circle cx="196" cy="98" r="16" fill="none" stroke="#111111" stroke-width="10" />

  <!-- Anchor Chain -->
  <!-- Chain link 1 -->
  <ellipse cx="160" cy="132" rx="10" ry="14" fill="none" stroke="#111111" stroke-width="6" transform="rotate(-30 160 132)" />
  <!-- Chain link 2 -->
  <ellipse cx="170" cy="160" rx="10" ry="14" fill="none" stroke="#111111" stroke-width="6" transform="rotate(20 170 160)" />
  <!-- Chain link 3 -->
  <ellipse cx="185" cy="190" rx="10" ry="14" fill="none" stroke="#111111" stroke-width="6" transform="rotate(-25 185 190)" />
  <!-- Chain link 4 -->
  <ellipse cx="215" cy="225" rx="10" ry="14" fill="none" stroke="#111111" stroke-width="6" transform="rotate(35 215 225)" />
  <!-- Chain link 5 -->
  <ellipse cx="220" cy="255" rx="10" ry="14" fill="none" stroke="#111111" stroke-width="6" transform="rotate(-15 220 255)" />

  <!-- Anchor Fluke Bottom Curve -->
  <path d="M 196,280 C 196,285 240,285 275,230" fill="none" stroke="#111111" stroke-width="16" stroke-linecap="round" />
  
  <!-- Anchor Arrowhead Tip -->
  <polygon points="275,230 260,248 285,248" fill="#111111" />

  <!-- Typography: CTL LINE -->
  <text x="200" y="420" font-family="'Impact', 'Arial Black', sans-serif" font-style="italic" font-weight="900" font-size="64" fill="#111111" text-anchor="middle" letter-spacing="4">
    CTL LINE
  </text>
</svg>
